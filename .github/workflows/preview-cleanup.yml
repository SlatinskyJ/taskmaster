name: Preview cleanup

# Removes per-PR previews (host calls live in preview-host.yml; runbook docs/runbooks/preview-host.md).
# - PR closed (merged or not): remove that PR's preview and mark its sticky comment.
# - Nightly and on demand: sweep every preview whose PR is no longer open.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove:
    name: remove preview
    # Fork PRs never get a preview (and get no secrets).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Same group as this PR's CI run (see `concurrency` in ci.yml; rename both together):
    # closing the PR cancels its CI run. preview-host.yml also queues this behind any deploy
    # for the PR, and the controller's lock makes `remove` wait on the host, so it comes last.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/preview-host.yml
    with:
      action: remove
      reason: closed
      pr: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      PREVIEW_URL_BASE: ${{ secrets.PREVIEW_URL_BASE }}

  sweep:
    name: sweep previews
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: preview-sweep
    permissions:
      contents: read
      pull-requests: read
    env:
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST || 'tm-previews' }}
    steps:
      - name: List open PRs
        # A failed or empty-by-error listing must stop the job: `sweep` with no PRs removes everything.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --paginate --jq '.[].number' > open-prs.txt
          echo "Open PRs: $(tr '\n' ' ' < open-prs.txt)"
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:tm-ci
          ping: ${{ vars.PREVIEW_HOST || 'tm-previews' }}
      - name: Sweep
        run: |
          set -euo pipefail
          tailscale ssh "deploy@${PREVIEW_HOST}" list
          tailscale ssh "deploy@${PREVIEW_HOST}" "sweep $(tr '\n' ' ' < open-prs.txt)"
          tailscale ssh "deploy@${PREVIEW_HOST}" list
