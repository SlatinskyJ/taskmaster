name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/slatinskyj/taskmaster

# preview-cleanup.yml joins this group on PR close (as ci-refs/pull/<n>/merge) to cancel a
# running deploy; rename both together.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow name `CI` is the trigger of merge-queue.yml (workflow_run); rename both together.
# Job names are required status checks in the main ruleset. Rename only together with the ruleset.
# `preview` (and the preview.yml / preview-cleanup.yml jobs) is deliberately not required: it
# runs only for labelled PRs, so requiring it would block every other PR.
# A job skipped by its `if` counts as passing for a required check.
jobs:
  # Docs-only PRs skip the heavy jobs (#78). "Docs" = Markdown that no check reads:
  # *.md under docs/ or .claude/, root *.md, .github/*.md (all Prettier-ignored; ESLint and tsc
  # skip .md). Any other file, including .ts under docs/ or .claude/, and every push to main, runs
  # all. Fail closed: if the file list can't be read, everything runs.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Detect code changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # New and old names, so a file moved out of a code path counts as a code change.
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)') || {
            echo "Could not list files: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          }
          echo "$files"
          code=$(grep -Ev '^((docs|\.claude)/.*\.md|[^/]+\.md|\.github/[^/]+\.md)$' <<<"$files" || true)
          if [ -z "$files" ] || [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No code changed: skipping checks."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    name: typecheck
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - &install
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm lint

  format:
    name: format
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm format:check

  # Schema and committed migrations agree, and the migrations apply to an empty DB (#16).
  migrations:
    name: migrations
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm db:check

  test:
    name: test
    needs: [typecheck, lint, format]
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm test

  build:
    name: build
    needs: [typecheck, lint, format]
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm build
      - name: Smoke-start the server
        run: |
          PORT=3000 node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then echo "server up"; break; fi
            if [ "$i" = 20 ]; then echo "server did not answer"; cat server.log; exit 1; fi
            sleep 1
          done
          # The service worker is built with this build's data and always revalidated.
          curl -fsS -D sw.headers -o sw.js http://127.0.0.1:3000/sw.js
          grep -q 'tm-shell-' sw.js || { echo "sw.js has no shell cache"; exit 1; }
          if grep -q '__TM_SW_BUILD__' sw.js; then echo "sw.js build data missing"; exit 1; fi
          grep -qi '^cache-control: no-cache' sw.headers || { echo "sw.js lacks no-cache"; cat sw.headers; exit 1; }
          echo "sw.js ok"
      # Browser tests against the built server: passkeys on (virtual authenticator) and off.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  # Mutation testing (#155) for the Tests judge: mutates the src/ lines this PR adds or changes and
  # lists surviving mutants (job log between the "=== mutation report ===" markers, job summary,
  # artifact mutation-report). Deliberately not a required check: survivors never fail it, only
  # a Stryker run that breaks (e.g. a red test suite) does.
  mutation:
    name: mutation
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - name: List the PR's files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" --paginate \
            --jq '[.[] | {filename, status, patch}]' | jq -s add > pr-files.json
      - run: node scripts/mutation/run.ts pr-files.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  # Multi-arch image (spec §11, #50). Each arch builds natively and smoke-runs the container,
  # including the image's own HEALTHCHECK. Read-only token; nothing is pushed here.
  # On docs-only PRs the job still starts, so the matrix expands and `image (amd64)` /
  # `image (arm64)` report as passed, but every step is skipped. A job-level skip would report
  # one unexpanded `image (${{ matrix.arch }})` check instead, which would hang if these two
  # are ever made required. Every step in this job must carry `if: env.CODE != 'false'`.
  image:
    name: image (${{ matrix.arch }})
    needs: [changes, typecheck, lint, format, migrations, test, build]
    if: ${{ !cancelled() && !failure() }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    strategy:
      matrix: &arches
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - if: env.CODE != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.CODE != 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        if: env.CODE != 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: taskmaster:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Smoke-run the container
        if: env.CODE != 'false'
        run: |
          docker run -d --name tm -p 3000:3000 -v tm-data:/data taskmaster:ci
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tm)
            if [ "$status" = healthy ]; then
              curl -fsS http://127.0.0.1:3000/api/health; echo
              curl -fsSI http://127.0.0.1:3000/sw.js | grep -qi '^cache-control: no-cache' \
                || { echo "sw.js lacks no-cache"; exit 1; }
              uid=$(docker exec tm id -u)
              if [ "$uid" = 0 ]; then echo "container runs as root"; exit 1; fi
              docker exec tm sh -c 'touch /data/.write-test && rm /data/.write-test'
              docker image ls taskmaster:ci
              docker stats --no-stream tm
              echo "image ok"; exit 0
            fi
            sleep 1
          done
          echo "container health: $status"; docker logs tm; exit 1
      # The exact tested image, handed to the main-only push job (and later to preview deploys).
      - name: Save tested image
        if: env.CODE != 'false'
        run: docker save taskmaster:ci | gzip -1 > image-${{ matrix.arch }}.tar.gz
      - if: env.CODE != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          retention-days: 3
          compression-level: 0

  # main only: push the exact images the `image` job tested. Only this job and `publish`
  # get a token that can write packages.
  push:
    name: push image (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    strategy:
      matrix: *arches
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
      - &ghcr-login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and push tested arch image
        run: |
          gunzip -c image-${{ matrix.arch }}.tar.gz | docker load
          tag="${IMAGE}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker tag taskmaster:ci "$tag"
          docker push "$tag"

  publish:
    name: publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [push]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - *ghcr-login
      - name: Join arch images into main + sha tags
        run: |
          src="${IMAGE}:sha-${GITHUB_SHA}"
          : "${GITHUB_SHA:?}"
          short="sha-${GITHUB_SHA::7}"
          [ "${#short}" = 11 ] || { echo "bad short tag: ${short}"; exit 1; }
          docker buildx imagetools create \
            -t "${IMAGE}:main" -t "${IMAGE}:${short}" \
            "${src}-amd64" "${src}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${short}"

  # main only: roll the image `publish` just pushed out to production (runbook
  # docs/runbooks/prod-host.md). Like previews, an ephemeral tailnet node whose only access is
  # Tailscale SSH as `deploy`, whose shell is deploy/prod/tm-prod. But it has its own tag
  # (tag:tm-cd-prod) and OAuth client, whose secrets live only in the `production` environment,
  # which admits only `main`: a PR run, which runs its branch's own workflow, can never get them.
  # Runs only when the PROD_HOST repository variable is set, so no host name lives in this repo.
  # Not a required check.
  deploy-prod:
    name: deploy prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PROD_HOST != ''
    needs: [publish]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    # One production deploy at a time; a newer main waits for the running one instead of cutting it off.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PROD_HOST: ${{ vars.PROD_HOST }}
    steps:
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_PROD_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_PROD_OAUTH_SECRET }}
          tags: tag:tm-cd-prod
          ping: ${{ env.PROD_HOST }}
      - name: Deploy on the production host
        run: |
          : "${GITHUB_SHA:?}"
          tailscale ssh "deploy@${PROD_HOST}" "deploy ${GITHUB_SHA::7}" < /dev/null

  # Per-PR preview on the preview host (#63, runbook docs/runbooks/preview-host.md). Opt-in:
  # only PRs with the `preview` label get one; adding the label later is handled by
  # preview.yml, removing it tears the preview down there too. Same-repo PRs only: fork PRs
  # get no secrets and never reach the host.
  preview:
    name: preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      needs.changes.outputs.code != 'false' &&
      needs.image.result == 'success'
    needs: [changes, image]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/preview-host.yml
    with:
      action: deploy
      pr: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      run_id: ${{ github.run_id }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      PREVIEW_URL_BASE: ${{ secrets.PREVIEW_URL_BASE }}
