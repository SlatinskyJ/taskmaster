name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are required status checks in the main ruleset. Rename only together with the ruleset.
jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - &install
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm lint

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm format:check

  test:
    name: test
    needs: [typecheck, lint, format]
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm test

  build:
    name: build
    needs: [typecheck, lint, format]
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm build
      - name: Smoke-start the server
        run: |
          PORT=3000 node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "server did not answer"; cat server.log; exit 1
