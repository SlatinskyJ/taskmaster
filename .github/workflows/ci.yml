name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/slatinskyj/taskmaster

# preview-cleanup.yml joins this group on PR close to cancel a running deploy; rename both together.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are required status checks in the main ruleset. Rename only together with the ruleset.
# A job skipped by its `if` counts as passing for a required check.
jobs:
  # Docs-only PRs skip the heavy jobs (#78). "Docs" = Markdown that no check reads:
  # *.md under docs/ or .claude/, root *.md, .github/*.md (all Prettier-ignored; ESLint and tsc
  # skip .md). Any other file, including .ts under docs/ or .claude/, and every push to main, runs
  # all. Fail closed: if the file list can't be read, everything runs.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Detect code changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # New and old names, so a file moved out of a code path counts as a code change.
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)') || {
            echo "Could not list files: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          }
          echo "$files"
          code=$(grep -Ev '^((docs|\.claude)/.*\.md|[^/]+\.md|\.github/[^/]+\.md)$' <<<"$files" || true)
          if [ -z "$files" ] || [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No code changed: skipping checks."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    name: typecheck
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - &install
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm lint

  format:
    name: format
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm format:check

  test:
    name: test
    needs: [typecheck, lint, format]
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm test

  build:
    name: build
    needs: [typecheck, lint, format]
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm build
      - name: Smoke-start the server
        run: |
          PORT=3000 node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "server did not answer"; cat server.log; exit 1

  # Multi-arch image (spec §11, #50). Each arch builds natively and smoke-runs the container,
  # including the image's own HEALTHCHECK. Read-only token; nothing is pushed here.
  # On docs-only PRs the job still starts, so the matrix expands and `image (amd64)` /
  # `image (arm64)` report as passed, but every step is skipped. A job-level skip would report
  # one unexpanded `image (${{ matrix.arch }})` check instead, which would hang if these two
  # are ever made required. Every step in this job must carry `if: env.CODE != 'false'`.
  image:
    name: image (${{ matrix.arch }})
    needs: [changes, typecheck, lint, format, test, build]
    if: ${{ !cancelled() && !failure() }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    strategy:
      matrix: &arches
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - if: env.CODE != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.CODE != 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        if: env.CODE != 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: taskmaster:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Smoke-run the container
        if: env.CODE != 'false'
        run: |
          docker run -d --name tm -p 3000:3000 -v tm-data:/data taskmaster:ci
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tm)
            if [ "$status" = healthy ]; then
              curl -fsS http://127.0.0.1:3000/api/health; echo
              uid=$(docker exec tm id -u)
              if [ "$uid" = 0 ]; then echo "container runs as root"; exit 1; fi
              docker exec tm sh -c 'touch /data/.write-test && rm /data/.write-test'
              docker image ls taskmaster:ci
              docker stats --no-stream tm
              echo "image ok"; exit 0
            fi
            sleep 1
          done
          echo "container health: $status"; docker logs tm; exit 1
      # The exact tested image, handed to the main-only push job (and later to preview deploys).
      - name: Save tested image
        if: env.CODE != 'false'
        run: docker save taskmaster:ci | gzip -1 > image-${{ matrix.arch }}.tar.gz
      - if: env.CODE != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          retention-days: 3
          compression-level: 0

  # main only: push the exact images the `image` job tested. Only this job and `publish`
  # get a token that can write packages.
  push:
    name: push image (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    strategy:
      matrix: *arches
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
      - &ghcr-login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and push tested arch image
        run: |
          gunzip -c image-${{ matrix.arch }}.tar.gz | docker load
          tag="${IMAGE}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker tag taskmaster:ci "$tag"
          docker push "$tag"

  publish:
    name: publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [push]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - *ghcr-login
      - name: Join arch images into main + sha tags
        run: |
          src="${IMAGE}:sha-${GITHUB_SHA}"
          : "${GITHUB_SHA:?}"
          short="sha-${GITHUB_SHA::7}"
          [ "${#short}" = 11 ] || { echo "bad short tag: ${short}"; exit 1; }
          docker buildx imagetools create \
            -t "${IMAGE}:main" -t "${IMAGE}:${short}" \
            "${src}-amd64" "${src}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${short}"

  # Per-PR preview on the preview host (#63, runbook docs/runbooks/preview-host.md). Same-repo
  # PRs only: fork PRs get no secrets and never reach the host. CI joins the tailnet as an
  # ephemeral tag:tm-ci node, whose only access is Tailscale SSH as `deploy`, whose shell is
  # the preview controller. No host names live in this repo.
  preview:
    name: preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.code != 'false' &&
      needs.image.result == 'success'
    needs: [changes, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_HOST: ${{ vars.PREVIEW_HOST || 'tm-previews' }}
      # Full https base (e.g. https://<host>.<tailnet>.ts.net); unset = the comment shows the port only.
      PREVIEW_URL_BASE: ${{ secrets.PREVIEW_URL_BASE }}
    steps:
      # The preview host is arm64 (Raspberry Pi); change this if the host moves to another arch.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-arm64
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:tm-ci
          ping: ${{ env.PREVIEW_HOST }}
      - name: Deploy preview
        id: deploy
        run: |
          set +e
          out=$(tailscale ssh "deploy@${PREVIEW_HOST}" "deploy ${PR}" < image-arm64.tar.gz 2>deploy.err)
          rc=$?
          set -e
          cat deploy.err >&2
          port=$(sed -n 's/^port: //p' <<<"$out")
          if [ "$rc" = 0 ] && [ -n "$port" ]; then
            if [ -n "$PREVIEW_URL_BASE" ]; then where="${PREVIEW_URL_BASE}:${port}"; else where="port ${port} on the preview host"; fi
            body="**Preview** for ${HEAD_SHA::7}: ${where} (tailnet only)"
          elif [ "$rc" = 75 ]; then
            body="**Preview skipped** for ${HEAD_SHA::7}: the preview host already runs its maximum. Free a slot with \`remove\` on the host (see docs/runbooks/preview-host.md), then push again."
          else
            body="**Preview failed** for ${HEAD_SHA::7}. See the \`preview\` job log."
          fi
          printf '%s\n\n<!-- tm-preview -->\n' "$body" > comment.md
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        if: always() && steps.deploy.outcome == 'success'
        # One sticky comment per PR, found by its marker, not by "last bot comment".
        # Marker and lookup are shared with preview-cleanup.yml; change both together.
        # The token is scoped to this step only, away from the third-party Tailscale action.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- tm-preview -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md >/dev/null
          fi
      - name: Fail on deploy error
        if: steps.deploy.outputs.rc != '0' && steps.deploy.outputs.rc != '75'
        run: exit 1
