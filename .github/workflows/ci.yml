name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/slatinskyj/taskmaster

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are required status checks in the main ruleset. Rename only together with the ruleset.
# A job skipped by its `if` counts as passing for a required check.
jobs:
  # Docs-only PRs skip the heavy jobs (#78). "Docs" = Markdown that no check reads:
  # *.md under docs/ or .claude/, root *.md, .github/*.md (all Prettier-ignored; ESLint and tsc
  # skip .md). Any other file, including .ts under docs/ or .claude/, and every push to main, runs
  # all. Fail closed: if the file list can't be read, everything runs.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Detect code changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # New and old names, so a file moved out of a code path counts as a code change.
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)') || {
            echo "Could not list files: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          }
          echo "$files"
          code=$(grep -Ev '^((docs|\.claude)/.*\.md|[^/]+\.md|\.github/[^/]+\.md)$' <<<"$files" || true)
          if [ -z "$files" ] || [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No code changed: skipping checks."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    name: typecheck
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - &install
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm lint

  format:
    name: format
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm format:check

  test:
    name: test
    needs: [typecheck, lint, format]
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm test

  build:
    name: build
    needs: [typecheck, lint, format]
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm build
      - name: Smoke-start the server
        run: |
          PORT=3000 node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "server did not answer"; cat server.log; exit 1

  # Multi-arch image (spec §11, #50). Each arch builds natively and smoke-runs the container,
  # including the image's own HEALTHCHECK. Read-only token; nothing is pushed here.
  # On docs-only PRs the job still starts, so the matrix expands and `image (amd64)` /
  # `image (arm64)` report as passed, but every step is skipped. A job-level skip would report
  # one unexpanded `image (${{ matrix.arch }})` check instead, which would hang if these two
  # are ever made required. Every step in this job must carry `if: env.CODE != 'false'`.
  image:
    name: image (${{ matrix.arch }})
    needs: [changes, typecheck, lint, format, test, build]
    if: ${{ !cancelled() && !failure() }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    strategy:
      matrix: &arches
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - if: env.CODE != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.CODE != 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        if: env.CODE != 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: taskmaster:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Smoke-run the container
        if: env.CODE != 'false'
        run: |
          docker run -d --name tm -p 3000:3000 -v tm-data:/data taskmaster:ci
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tm)
            if [ "$status" = healthy ]; then
              curl -fsS http://127.0.0.1:3000/api/health; echo
              uid=$(docker exec tm id -u)
              if [ "$uid" = 0 ]; then echo "container runs as root"; exit 1; fi
              docker exec tm sh -c 'touch /data/.write-test && rm /data/.write-test'
              docker image ls taskmaster:ci
              docker stats --no-stream tm
              echo "image ok"; exit 0
            fi
            sleep 1
          done
          echo "container health: $status"; docker logs tm; exit 1
      # The exact tested image, handed to the main-only push job (and later to preview deploys).
      - name: Save tested image
        if: env.CODE != 'false'
        run: docker save taskmaster:ci | gzip -1 > image-${{ matrix.arch }}.tar.gz
      - if: env.CODE != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          retention-days: 3
          compression-level: 0

  # main only: push the exact images the `image` job tested. Only this job and `publish`
  # get a token that can write packages.
  push:
    name: push image (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    strategy:
      matrix: *arches
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
      - &ghcr-login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and push tested arch image
        run: |
          gunzip -c image-${{ matrix.arch }}.tar.gz | docker load
          tag="${IMAGE}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker tag taskmaster:ci "$tag"
          docker push "$tag"

  publish:
    name: publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [push]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - *ghcr-login
      - name: Join arch images into main + sha tags
        run: |
          src="${IMAGE}:sha-${GITHUB_SHA}"
          : "${GITHUB_SHA:?}"
          short="sha-${GITHUB_SHA::7}"
          [ "${#short}" = 11 ] || { echo "bad short tag: ${short}"; exit 1; }
          docker buildx imagetools create \
            -t "${IMAGE}:main" -t "${IMAGE}:${short}" \
            "${src}-amd64" "${src}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${short}"

  # Per-PR preview on the preview host (#63, runbook docs/runbooks/preview-host.md). Opt-in:
  # only PRs with the `preview` label get one; adding the label later is handled by
  # preview.yml, removing it tears the preview down there too. Same-repo PRs only: fork PRs
  # get no secrets and never reach the host.
  preview:
    name: preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      needs.changes.outputs.code != 'false' &&
      needs.image.result == 'success'
    needs: [changes, image]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/preview-deploy.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      run_id: ${{ github.run_id }}
    secrets: inherit
