name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names are required status checks in the main ruleset. Rename only together with the ruleset.
jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - &install
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm lint

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm format:check

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - run: pnpm build
      - name: Smoke-start the server
        run: |
          PORT=3000 node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "server did not answer"; cat server.log; exit 1

  # Multi-arch image (spec §11, #50). Each arch builds natively, then smoke-runs the container.
  # On main, after all gates pass, the arch images are pushed and joined into one tag.
  image:
    name: image (${{ matrix.arch }})
    needs: [typecheck, lint, format, test, build]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/slatinskyj/taskmaster
    steps:
      - *checkout
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: taskmaster:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Smoke-run the container
        run: |
          docker run -d --name tm -p 3000:3000 -v tm-data:/data taskmaster:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo; docker exec tm sh -c 'id -u && touch /data/.write-test && rm /data/.write-test'
              echo "image ok"; docker stats --no-stream tm; exit 0
            fi
            sleep 1
          done
          docker logs tm; exit 1
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push arch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag="${IMAGE}:sha-${GITHUB_SHA::7}-${{ matrix.arch }}"
          docker tag taskmaster:ci "$tag"
          docker push "$tag"

  publish:
    name: publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/slatinskyj/taskmaster
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join arch images into main + sha tags
        run: |
          sha="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t "${IMAGE}:main" -t "${IMAGE}:${sha}" \
            "${IMAGE}:${sha}-amd64" "${IMAGE}:${sha}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${sha}"
