# Dependabot (#68): keeps the Dockerfile's digest-pinned Node base image current.
# Only the docker ecosystem for now; npm updates are a separate decision.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Prague
    # Stay on Node 22 (package.json engines, .nvmrc); a major bump is a deliberate change.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    labels: [chore]
    commit-message:
      prefix: 'chore(docker)'
